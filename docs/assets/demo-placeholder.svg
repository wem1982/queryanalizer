<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="QueryAnalyzer diagram preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0f1419"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <text x="400" y="48" fill="#e8edf4" font-family="Segoe UI, sans-serif" font-size="28" text-anchor="middle" font-weight="600">QueryAnalyzer</text>
  <text x="400" y="78" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">SQL ’ interactive relationship graph</text>
  <rect x="60" y="120" width="280" height="220" rx="12" fill="#243044" stroke="#2d3a4f"/>
  <text x="80" y="150" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">SELECT ...</text>
  <text x="80" y="172" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">FROM orders o</text>
  <text x="80" y="194" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">JOIN customers c</text>
  <text x="80" y="216" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">  ON c.id = o.customer_id</text>
  <rect x="460" y="120" width="280" height="220" rx="12" fill="#243044" stroke="#2d3a4f"/>
  <circle cx="540" cy="200" r="36" fill="#1a2332" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="205" fill="#e8edf4" font-size="13" text-anchor="middle" font-family="Segoe UI">o</text>
  <circle cx="660" cy="200" r="36" fill="#1a2332" stroke="#3b82f6" stroke-width="2"/>
  <text x="660" y="205" fill="#e8edf4" font-size="13" text-anchor="middle" font-family="Segoe UI">c</text>
  <line x1="576" y1="200" x2="624" y2="200" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
